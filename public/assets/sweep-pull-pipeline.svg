<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="fwd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/>
    </marker>
    <marker id="pull" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <!-- stations -->
  <g stroke="#333" fill="none" stroke-width="1.5">
    <rect x="20"  y="100" width="110" height="44" rx="8"/>
    <rect x="170" y="100" width="110" height="44" rx="8"/>
    <rect x="320" y="100" width="130" height="44" rx="8"/>
    <rect x="490" y="100" width="90"  height="44" rx="8"/>
    <rect x="620" y="100" width="90"  height="44" rx="8"/>
    <rect x="750" y="96"  width="96"  height="52" rx="26" stroke-dasharray="none" stroke-width="2.5"/>
  </g>
  <g fill="#1f2937" font-size="15" text-anchor="middle">
    <text x="75"  y="127">search</text>
    <text x="225" y="127">triage</text>
    <text x="385" y="127">investigate</text>
    <text x="535" y="127">qa</text>
    <text x="665" y="127">drip</text>
    <text x="798" y="122" font-size="14">maintainer</text>
    <text x="798" y="139" font-size="11" fill="#666">the customer</text>
  </g>

  <!-- part flow: left to right, above -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none">
    <line x1="130" y1="112" x2="168" y2="112" marker-end="url(#fwd)"/>
    <line x1="280" y1="112" x2="318" y2="112" marker-end="url(#fwd)"/>
    <line x1="450" y1="112" x2="488" y2="112" marker-end="url(#fwd)"/>
    <line x1="580" y1="112" x2="618" y2="112" marker-end="url(#fwd)"/>
    <line x1="710" y1="112" x2="748" y2="112" marker-end="url(#fwd)"/>
  </g>
  <g fill="#666" font-size="11" text-anchor="middle">
    <text x="149" y="103">issue</text>
    <text x="299" y="103">issue</text>
    <text x="469" y="103">patch</text>
    <text x="599" y="103">patch</text>
    <text x="729" y="103">PR</text>
  </g>

  <!-- kanban pull: right to left, below -->
  <g stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
    <line x1="748" y1="134" x2="712" y2="134" marker-end="url(#pull)"/>
    <line x1="618" y1="134" x2="582" y2="134" marker-end="url(#pull)"/>
    <line x1="488" y1="134" x2="452" y2="134" marker-end="url(#pull)"/>
    <line x1="318" y1="134" x2="282" y2="134" marker-end="url(#pull)"/>
    <line x1="168" y1="134" x2="132" y2="134" marker-end="url(#pull)"/>
  </g>

  <!-- reinvestigate loop: qa back to investigate -->
  <path d="M 520 144 C 500 190, 420 190, 398 146" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#fwd)"/>
  <text x="459" y="188" fill="#666" font-size="11" text-anchor="middle">reinvestigate</text>

  <!-- remit loop: maintainer back to investigate -->
  <path d="M 780 148 C 720 240, 460 240, 392 148" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#fwd)"/>
  <text x="590" y="225" fill="#666" font-size="11" text-anchor="middle">maintainer raises a concern</text>

  <!-- legend -->
  <g font-size="12" fill="#1f2937">
    <line x1="24" y1="30" x2="64" y2="30" stroke="#1f2937" stroke-width="1.5" marker-end="url(#fwd)"/>
    <text x="72" y="34">parts flow downstream</text>
    <line x1="250" y1="30" x2="290" y2="30" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#pull)"/>
    <text x="298" y="34">kanban: authorization flows upstream</text>
  </g>
</svg>
