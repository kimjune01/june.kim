  <text x="210" y="299" text-anchor="middle" font-size="12" fill="#222">identify a stable correct</text>
  <text x="210" y="315" text-anchor="middle" font-size="12" fill="#222">or defective trajectory</text>

  <line x1="360" y1="302" x2="410" y2="302" stroke="#555" stroke-width="1.5"/>
  <line x1="410" y1="302" x2="410" y2="38" stroke="#555" stroke-width="1.5"/>
  <line x1="410" y1="38" x2="446" y2="38" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="16" width="300" height="44" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
