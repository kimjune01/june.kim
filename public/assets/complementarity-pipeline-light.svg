  <line x1="600" y1="258" x2="600" y2="276" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="280" width="300" height="44" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
