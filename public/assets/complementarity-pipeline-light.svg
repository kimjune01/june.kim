  <line x1="210" y1="192" x2="210" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="214" width="300" height="44" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="210" y="241" text-anchor="middle" font-size="12" fill="#222">repeated solo-agent runs</text>
  <line x1="210" y1="258" x2="210" y2="276" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

