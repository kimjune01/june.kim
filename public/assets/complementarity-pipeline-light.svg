  <line x1="210" y1="60" x2="210" y2="78" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="82" width="300" height="44" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="210" y="109" text-anchor="middle" font-size="12" fill="#222">controlled mutation</text>
  <line x1="210" y1="126" x2="210" y2="144" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="148" width="300" height="44" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
