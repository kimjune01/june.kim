<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="40" y="20" width="130" height="36" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="105" y="43" text-anchor="middle" font-size="13" fill="#222">ban AI</text>
  <line x1="174" y1="38" x2="212" y2="38" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="42" font-size="12" fill="#333">measure an increasingly artificial unaided workflow</text>

  <rect x="40" y="72" width="130" height="36" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="105" y="95" text-anchor="middle" font-size="13" fill="#222">allow AI</text>
  <line x1="174" y1="90" x2="212" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="94" font-size="12" fill="#333">lose attribution on tasks the agent can solve alone</text>

  <rect x="40" y="124" width="130" height="36" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="105" y="147" text-anchor="middle" font-size="13" fill="#222">watch live</text>
  <line x1="174" y1="142" x2="212" y2="142" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="146" font-size="12" fill="#333">add stress and cost without a declared human-contribution rubric</text>

  <rect x="40" y="176" width="130" height="36" rx="6" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="105" y="199" text-anchor="middle" font-size="13" fill="#222">detect AI</text>
  <line x1="174" y1="194" x2="212" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="198" font-size="12" fill="#333">classify tool use, not whether the use improved the outcome</text>
</svg>
