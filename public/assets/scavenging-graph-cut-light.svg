<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .region { fill: none; stroke: #cbd5e1; stroke-width: 1.5; }
    .region-label { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .node { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
    .node-out { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
    .node-text { text-anchor: middle; font-size: 12px; font-weight: 600; fill: #334155; }
    .node-sub { text-anchor: middle; font-size: 9.5px; fill: #64748b; }
    .node-text-out { text-anchor: middle; font-size: 12px; font-weight: 600; fill: #94a3b8; }
    .edge { stroke: #64748b; stroke-width: 1.3; fill: none; marker-end: url(#ah2); }
    .cut { fill: none; stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 8 5; }
    .cut-label { font-size: 11px; font-style: italic; font-weight: 600; fill: #1d4ed8; }
    .scar { font-size: 9.5px; font-style: italic; fill: #1d4ed8; }
    .scar-out { font-size: 9.5px; font-style: italic; fill: #94a3b8; }
    .move { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#ah2b); }
    .move-label { text-anchor: middle; font-size: 11px; fill: #334155; font-weight: 600; }
    .move-sub { text-anchor: middle; font-size: 9.5px; fill: #64748b; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="ah2b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- donor region -->
  <rect class="region" x="25" y="30" width="530" height="360" rx="10"/>
  <text class="region-label" x="40" y="54">DONOR REPOSITORY</text>

  <!-- the cut -->
  <rect class="cut" x="55" y="80" width="415" height="215" rx="14"/>
  <text class="cut-label" x="62" y="315">the cut: copy until the behavior closes</text>

  <!-- nodes inside the cut -->
  <rect class="node" x="80" y="100" width="140" height="42" rx="6"/>
  <text class="node-text" x="150" y="120">API handler</text>
  <text class="node-sub" x="150" y="133">campaign endpoints</text>

  <rect class="node" x="80" y="220" width="140" height="42" rx="6"/>
  <text class="node-text" x="150" y="240">campaign tables</text>
  <text class="node-sub" x="150" y="253">+ state transitions</text>

  <rect class="node" x="300" y="100" width="140" height="42" rx="6"/>
  <text class="node-text" x="370" y="120">scheduler</text>
  <text class="node-sub" x="370" y="133">+ idempotency record</text>

  <rect class="node" x="300" y="220" width="140" height="42" rx="6"/>
  <text class="node-text" x="370" y="240">delivery worker</text>
  <text class="node-sub" x="370" y="253">+ retry classes</text>

  <!-- behavior path edges -->
  <line class="edge" x1="150" y1="142" x2="150" y2="220"/>
  <line class="edge" x1="220" y1="230" x2="300" y2="132"/>
  <line class="edge" x1="370" y1="142" x2="370" y2="220"/>
  <line class="edge" x1="300" y1="248" x2="220" y2="243"/>

  <!-- shared-surface scars (cross the cut) -->
  <text class="scar" x="452" y="98">scar: timezone rules</text>
  <line x1="448" y1="103" x2="428" y2="112" stroke="#1d4ed8" stroke-width="1"/>
  <text class="scar" x="452" y="278">scar: token rotation</text>
  <line x1="448" y1="272" x2="428" y2="258" stroke="#1d4ed8" stroke-width="1"/>

  <!-- donor-local machinery, outside the cut -->
  <rect class="node-out" x="80" y="330" width="140" height="36" rx="6"/>
  <text class="node-text-out" x="150" y="352">their dashboard</text>
  <rect class="node-out" x="300" y="330" width="140" height="36" rx="6"/>
  <text class="node-text-out" x="370" y="352">their Kafka config</text>
  <text class="scar-out" x="452" y="345">scar: their broker quirk</text>
  <line x1="448" y1="348" x2="442" y2="348" stroke="#94a3b8" stroke-width="1"/>
  <text class="scar-out" x="452" y="358">(cause stayed behind)</text>

  <!-- the move -->
  <path class="move" d="M470,188 L640,188"/>
  <text class="move-label" x="555" y="172">characterization tests</text>
  <text class="move-sub" x="555" y="206">preserve the boundary</text>
  <text class="move-sub" x="555" y="218">through the move</text>

  <!-- receiving region -->
  <rect class="region" x="640" y="30" width="335" height="360" rx="10"/>
  <text class="region-label" x="660" y="54">RECEIVING REPOSITORY</text>
  <!-- interface edge -->
  <line x1="640" y1="90" x2="640" y2="330" stroke="#334155" stroke-width="3"/>
  <text x="652" y="336" font-size="10" font-style="italic" fill="#334155">the interface: the receiving system supplies the boundary</text>

  <!-- transplanted unit -->
  <rect x="680" y="110" width="255" height="160" rx="14" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="node-text" x="807" y="180">transplanted unit</text>
  <text class="node-sub" x="807" y="196">the largest proven unit that fits,</text>
  <text class="node-sub" x="807" y="209">scars whose cause you share included</text>

  <!-- legend -->
  <text class="scar" x="640" y="418">blue: crosses the cut</text>
  <text class="scar-out" x="790" y="418">gray: stays behind</text>
</svg>
