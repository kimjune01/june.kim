<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Six weeks to saturation</title><desc id="desc">Weekly scores approach 100 percent much earlier than the launch forecast.</desc><rect width="900" height="470" fill="#f7f9fb" /><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" font-size="28" fill="#202a35" font-weight="700" text-anchor="start">The benchmark lifecycle is getting shorter</text><line x1="90" y1="365.0" x2="600" y2="365.0" stroke="#dbe2e7" stroke-width="1.5" /><text x="74" y="371.0" font-size="17" fill="#60707d" font-weight="400" text-anchor="end">0%</text><line x1="90" y1="310.0" x2="600" y2="310.0" stroke="#dbe2e7" stroke-width="1.5" /><text x="74" y="316.0" font-size="17" fill="#60707d" font-weight="400" text-anchor="end">25%</text><line x1="90" y1="255.0" x2="600" y2="255.0" stroke="#dbe2e7" stroke-width="1.5" /><text x="74" y="261.0" font-size="17" fill="#60707d" font-weight="400" text-anchor="end">50%</text><line x1="90" y1="200.0" x2="600" y2="200.0" stroke="#dbe2e7" stroke-width="1.5" /><text x="74" y="206.0" font-size="17" fill="#60707d" font-weight="400" text-anchor="end">75%</text><line x1="90" y1="144.99999999999997" x2="600" y2="144.99999999999997" stroke="#dbe2e7" stroke-width="1.5" /><text x="74" y="150.99999999999997" font-size="17" fill="#60707d" font-weight="400" text-anchor="end">100%</text><text x="90" y="397" font-size="17" fill="#60707d" font-weight="400" text-anchor="middle">0</text><text x="175" y="397" font-size="17" fill="#60707d" font-weight="400" text-anchor="middle">1</text><text x="260" y="397" font-size="17" fill="#60707d" font-weight="400" text-anchor="middle">2</text><text x="345" y="397" font-size="17" fill="#60707d" font-weight="400" text-anchor="middle">3</text><text x="430" y="397" font-size="17" fill="#60707d" font-weight="400" text-anchor="middle">4</text><text x="515" y="397" font-size="17" fill="#60707d" font-weight="400" text-anchor="middle">5</text><text x="600" y="397" font-size="17" fill="#60707d" font-weight="400" text-anchor="middle">6</text><text x="345" y="429" font-size="18" fill="#60707d" font-weight="400" text-anchor="middle">Weeks since benchmark release</text><polyline points="90,296.8 175,250.6 260,202.2 345,171.39999999999998 430,153.79999999999998 515,149.39999999999998 600,146.31999999999996" fill="none" stroke="#3768cf" stroke-width="3.5" /><circle cx="600" cy="146.31999999999996" r="4.5" fill="#3768cf" /><rect x="645" y="142" width="22" height="4" rx="0" fill="#3768cf" /><text x="680" y="154" font-size="19" fill="#3768cf" font-weight="400" text-anchor="start">FoldBench</text><polyline points="90,316.6 175,277.0 260,213.2 345,175.79999999999998 430,158.2 515,149.39999999999998 600,146.98" fill="none" stroke="#168577" stroke-width="3.5" /><circle cx="600" cy="146.98" r="4.5" fill="#168577" /><rect x="645" y="171" width="22" height="4" rx="0" fill="#168577" /><text x="680" y="183" font-size="19" fill="#168577" font-weight="400" text-anchor="start">DishBench</text><polyline points="90,332.0 175,288.0 260,239.6 345,186.79999999999998 430,160.39999999999998 515,149.39999999999998 600,145.44" fill="none" stroke="#c17732" stroke-width="3.5" /><circle cx="600" cy="145.44" r="4.5" fill="#c17732" /><rect x="645" y="200" width="22" height="4" rx="0" fill="#c17732" /><text x="680" y="212" font-size="19" fill="#c17732" font-weight="400" text-anchor="start">JarBench</text><path d="M90 299 L600 211" fill="none" stroke="#60707d" stroke-width="2" stroke-dasharray="7 6" /><text x="643" y="287" font-size="18" fill="#60707d" font-weight="400" text-anchor="start">Launch forecast</text><text x="643" y="315" font-size="18" fill="#60707d" font-weight="400" text-anchor="start">70% by week six</text></g></svg>
