<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc"><title id="title">Episode success versus shift performance</title><desc id="desc">Audit reports 99.2 percent prepared episode success, 0.3 percent unassisted shifts, 704 accepted packages with 96 human support minutes versus 760 packages for a human worker.</desc><rect width="900" height="490" fill="#f7f9fb" /><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" font-size="29" fill="#202a35" font-weight="700" text-anchor="start">Same robot. Different boundary.</text><rect x="38" y="108" width="402" height="170" rx="8" fill="#edf1f5" /><text x="60" y="176" font-size="54" fill="#3768cf" font-weight="700" text-anchor="start">99.2%</text><text x="60" y="220" font-size="22" fill="#202a35" font-weight="700" text-anchor="start">Prepared episodes passed</text><rect x="460" y="108" width="402" height="170" rx="8" fill="#edf1f5" /><text x="482" y="176" font-size="54" fill="#c17732" font-weight="700" text-anchor="start">0.3%</text><text x="482" y="220" font-size="22" fill="#202a35" font-weight="700" text-anchor="start">Shifts without assistance</text><text x="38" y="329" font-size="22" fill="#202a35" font-weight="700" text-anchor="start">Accepted packages per eight-hour shift</text><text x="38" y="382" font-size="19" fill="#202a35" font-weight="400" text-anchor="start">Robot + support</text><rect x="245" y="358" width="450.56" height="30" rx="3" fill="#3768cf" /><text x="710.56" y="382" font-size="22" fill="#3768cf" font-weight="700" text-anchor="start">704</text><text x="38" y="442" font-size="19" fill="#202a35" font-weight="400" text-anchor="start">Human worker</text><rect x="245" y="418" width="486.40000000000003" height="30" rx="3" fill="#168577" /><text x="746.4000000000001" y="442" font-size="22" fill="#168577" font-weight="700" text-anchor="start">760</text></g></svg>
