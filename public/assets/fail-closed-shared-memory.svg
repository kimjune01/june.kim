<svg viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fail-closed publication into shared semantic memory</title>
  <desc id="desc">A worker submits a claim and receipt to an atomic publication gate. Current dependencies and a valid receipt admit the claim to shared memory. Failed checks leave memory unchanged. A later root revision makes dependent claims historical while preserving independent work.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; font-size: 12px; }
    .label { fill: #64748b; font-size: 10px; letter-spacing: .06em; }
    .tiny { fill: #64748b; font-size: 10px; }
    .bold { font-weight: 700; }
    .blue { fill: #1d4ed8; } .green { fill: #15803d; } .red { fill: #b91c1c; } .amber { fill: #b45309; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#16a34a"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#dc2626"/></marker>
  </defs>
  <text x="34" y="28" class="label bold">WORKER</text>
  <text x="292" y="28" class="label bold">ATOMIC PUBLICATION GATE</text>
  <text x="565" y="28" class="label bold">SHARED MEMORY</text>
  <rect x="34" y="48" width="190" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="74" class="blue bold">candidate claim</text>
  <text x="52" y="99" class="tiny">receipt · observed outcome</text>
  <text x="52" y="119" class="tiny">node version · parent versions</text>
  <text x="52" y="139" class="tiny">lease · output contract</text>
  <line x1="224" y1="103" x2="286" y2="103" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="255" y="91" text-anchor="middle" class="tiny">submit</text>
  <rect x="292" y="48" width="214" height="110" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <g fill="#fff" stroke="#f59e0b" stroke-width="1.5"><circle cx="316" cy="78" r="7"/><circle cx="316" cy="106" r="7"/><circle cx="316" cy="134" r="7"/></g>
  <g fill="none" stroke="#b45309" stroke-width="1.7"><path d="M312 78l3 3 6-7"/><path d="M312 106l3 3 6-7"/><path d="M312 134l3 3 6-7"/></g>
  <text x="334" y="82" class="amber bold">receipt verifies</text>
  <text x="334" y="110" class="amber bold">parents are current</text>
  <text x="334" y="138" class="amber bold">lease is live</text>
  <line x1="506" y1="103" x2="558" y2="103" stroke="#16a34a" stroke-width="1.8" marker-end="url(#green-arrow)"/>
  <text x="532" y="91" text-anchor="middle" class="green tiny bold">commit</text>
  <rect x="564" y="48" width="162" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="582" y="74" class="green bold">current knowledge</text>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"><circle cx="598" cy="108" r="8"/><circle cx="646" cy="108" r="8"/><circle cx="694" cy="108" r="8"/></g>
  <g stroke="#86efac" stroke-width="1.5"><line x1="606" y1="108" x2="638" y2="108"/><line x1="654" y1="108" x2="686" y2="108"/></g>
  <text x="582" y="141" class="tiny">dependent work unlocks</text>
  <path d="M399 158V211H224" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#red-arrow)"/>
  <text x="318" y="197" text-anchor="middle" class="red tiny bold">any check fails</text>
  <rect x="34" y="190" width="190" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="52" y="218" class="red bold">reject publication</text>
  <text x="52" y="242" class="tiny">shared memory is unchanged</text>
  <path d="M129 158V181" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="129" y="178" text-anchor="middle" class="tiny">crash / retry / delay</text>
  <line x1="34" y1="302" x2="726" y2="302" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="326" class="label bold">LATER REVISION</text>
  <circle cx="200" cy="346" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="350" text-anchor="middle" class="red tiny bold">R²</text>
  <path d="M210 346H263" stroke="#dc2626" stroke-width="1.5" marker-end="url(#red-arrow)"/>
  <rect x="270" y="327" width="200" height="38" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="350" text-anchor="middle" class="amber tiny bold">descendants → historical</text>
  <path d="M470 346H533" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="540" y="327" width="186" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="633" y="350" text-anchor="middle" class="green tiny bold">independent work survives</text>
</svg>
