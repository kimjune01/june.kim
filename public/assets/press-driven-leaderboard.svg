<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">A leaderboard with the purchasing columns missing</title><desc id="desc">Fictional robots beat a human episode baseline; no entry reports full-shift completion or assistance.</desc><rect width="900" height="550" fill="#f7f9fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="47" font-size="29" fill="#202a35" font-weight="700" text-anchor="start">PackBench Verified</text><text x="38" y="80" font-size="19" fill="#60707d" font-weight="400" text-anchor="start">Prepared episodes • fixed order mix • final-state grading</text><rect x="38" y="104" width="824" height="40" rx="0" fill="#e8edf3"/><text x="55" y="130" font-size="16" fill="#60707d" font-weight="700" text-anchor="start">SYSTEM</text><text x="469" y="130" font-size="16" fill="#60707d" font-weight="700" text-anchor="start">SUCCESS</text><text x="614" y="130" font-size="16" fill="#60707d" font-weight="700" text-anchor="start">FULL SHIFT</text><text x="764" y="130" font-size="16" fill="#60707d" font-weight="700" text-anchor="start">HELP</text><text x="55" y="180" font-size="18" fill="#60707d" font-weight="400" text-anchor="start">01</text><text x="100" y="180" font-size="23" fill="#3768cf" font-weight="700" text-anchor="start">Calvin-3</text><text x="469" y="180" font-size="23" fill="#3768cf" font-weight="700" text-anchor="start">99.2%</text><text x="635" y="180" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">—</text><text x="778" y="180" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">—</text><line x1="38" y1="204" x2="862" y2="204" stroke="#dbe2e7" stroke-width="1.5"/><text x="55" y="246" font-size="18" fill="#60707d" font-weight="400" text-anchor="start">02</text><text x="100" y="246" font-size="23" fill="#202a35" font-weight="400" text-anchor="start">Daneel-2</text><text x="469" y="246" font-size="23" fill="#202a35" font-weight="700" text-anchor="start">98.8%</text><text x="635" y="246" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">—</text><text x="778" y="246" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">—</text><line x1="38" y1="270" x2="862" y2="270" stroke="#dbe2e7" stroke-width="1.5"/><text x="55" y="312" font-size="18" fill="#60707d" font-weight="400" text-anchor="start">03</text><text x="100" y="312" font-size="23" fill="#202a35" font-weight="400" text-anchor="start">Giskard-Lite</text><text x="469" y="312" font-size="23" fill="#202a35" font-weight="700" text-anchor="start">98.1%</text><text x="635" y="312" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">—</text><text x="778" y="312" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">—</text><line x1="38" y1="336" x2="862" y2="336" stroke="#dbe2e7" stroke-width="1.5"/><text x="55" y="378" font-size="18" fill="#60707d" font-weight="400" text-anchor="start">—</text><text x="100" y="378" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">Human baseline¹</text><text x="469" y="378" font-size="23" fill="#60707d" font-weight="700" text-anchor="start">94.6%</text><text x="635" y="378" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">—</text><text x="778" y="378" font-size="23" fill="#60707d" font-weight="400" text-anchor="start">—</text><line x1="38" y1="402" x2="862" y2="402" stroke="#dbe2e7" stroke-width="1.5"/><text x="38" y="458" font-size="18" fill="#60707d" font-weight="400" text-anchor="start">¹ Ten-minute orientation. Baseline reused across releases.</text><text x="38" y="490" font-size="18" fill="#60707d" font-weight="400" text-anchor="start">A dash means unreported, not zero.</text><text x="38" y="527" font-size="14" fill="#60707d" font-weight="400" text-anchor="start">ILLUSTRATIVE FICTION  /  PRESS-DRIVEN DEVELOPMENT</text></g></svg>