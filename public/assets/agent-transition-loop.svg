<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" font-family="system-ui, sans-serif">
  <style>
    .box { fill: #fff; stroke: #aaa; stroke-width: 1.2; }
    .decision { fill: #fff8e1; stroke: #ef6c00; stroke-width: 1.6; }
    .gate { fill: #f5f5f5; stroke: #555; stroke-width: 1.5; }
    .observe { fill: #eef6ff; stroke: #3975a8; stroke-width: 1.5; }
    .text { font-size: 13px; fill: #333; text-anchor: middle; }
    .small { font-size: 10.5px; fill: #666; text-anchor: middle; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; fill: #333; text-anchor: middle; }
    .arrow { fill: none; stroke: #777; stroke-width: 1.4; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: #3975a8; stroke-width: 1.5; stroke-dasharray: 5 3; marker-end: url(#blue-arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#777"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#3975a8"/></marker>
  </defs>

  <rect class="box" x="22" y="74" width="108" height="70" rx="6"/>
  <text class="text" x="76" y="103">message</text>
  <text class="small" x="76" y="123">state + goal</text>
  <path class="arrow" d="M130 109H166"/>

  <rect class="decision" x="166" y="64" width="132" height="90" rx="7"/>
  <text class="text" x="232" y="91">decide</text>
  <text class="small" x="232" y="112">proposed action</text>
  <text class="small" x="232" y="130">desired next state</text>
  <path class="arrow" d="M298 109H334"/>

  <rect class="gate" x="334" y="74" width="100" height="70" rx="6"/>
  <text class="text" x="384" y="102">gate</text>
  <text class="small" x="384" y="122">may this commit?</text>
  <path class="arrow" d="M434 109H470"/>

  <rect class="box" x="470" y="74" width="108" height="70" rx="6"/>
  <text class="text" x="524" y="103">execute</text>
  <text class="small" x="524" y="123">change the world</text>
  <path class="arrow" d="M578 109H614"/>

  <rect class="observe" x="614" y="64" width="124" height="90" rx="7"/>
  <text class="text" x="676" y="91">observe</text>
  <text class="small" x="676" y="112">actual state</text>
  <text class="small" x="676" y="130">now or after a delay</text>

  <path class="feedback" d="M676 154V180H560Q537 180 537 203V220"/>
  <rect class="observe" x="371" y="198" width="166" height="44" rx="6"/>
  <text class="text" x="454" y="217">compare</text>
  <text class="small" x="454" y="233">resolve the experiment</text>
  <path class="feedback" d="M371 220H76V144"/>

  <path class="feedback" d="M384 144V176H76V144"/>
  <text class="small" x="229" y="170">rejection becomes a message</text>

  <text class="mono" x="380" y="276">every feedback path re-enters through the inbox</text>
</svg>
